[package]
name = "git-drafts"
version = "0.1.2"
edition = "2021"
description = "Multi-phase layered staging drafts for Git — safe experimentation with AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Girgis98/git-drafts"
